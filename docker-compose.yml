version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: green-points-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: green-points
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - green-points-network

  # ML Service (Python FastAPI)
  ml-service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: green-points-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    volumes:
      - ./ml_service/models:/app/models
    networks:
      - green-points-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node.js Backend
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: green-points-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/green-points?authSource=admin
      - ML_API_URL=http://ml-service:8000
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
      - ml-service
    networks:
      - green-points-network
    volumes:
      - ./server:/app
      - /app/node_modules

  # React Frontend (Development)
  frontend:
    image: node:18-alpine
    working_dir: /app
    container_name: green-points-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:5000/api
    depends_on:
      - backend
    networks:
      - green-points-network
    volumes:
      - ./client:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  mongodb_data:
    driver: local

networks:
  green-points-network:
    driver: bridge
